server:
  port: ${APP_PORT:9000}
spring:
  application:
    name: microservice-products
  datasource:
    url: jdbc:h2:file:./data/products-db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: true # ${H2_CONSOLE_ENABLED:true}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:products-events-consumer}
      properties:
        spring.json.trusted.packages: "net.wowdev.microservice.ecommerce.dto"

    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    producer:

      # Strict idempotence. NOTE: Kafka rejects `enable.idempotence=true` together
      # with acks=1 (ConfigException at producer start) — the broker cannot
      # deduplicate without full ISR acknowledgement. acks=all is therefore
      # required; see README "Spec deviations".
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # Reject records that do not match the registered writer schema.
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        linger.ms: 0

app:
  kafka:
    product-changes-topic: ${KAFKA_PRODUCT_CHANGES_TOPIC:product-changes-topic.v1}
    inventory-changes-topic: ${KAFKA_INVENTORY_CHANGES_TOPIC:inventory-changes-topic.v1}

logging:
  level:
    net.wowdev.microservices.products: DEBUG
    org.hibernate.orm.jdbc.bind: DEBUG