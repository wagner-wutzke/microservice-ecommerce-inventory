server:
  port: ${APP_PORT:9000}
spring:
  application:
    name: microservice-products
  datasource:
    url: jdbc:h2:file:./data/products-db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:products-consumer}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Confluent Avro serializer: schema is registered/validated at the edge,
      # so a non-conforming payload never reaches the topic.
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # Strict idempotence. NOTE: Kafka rejects `enable.idempotence=true` together
      # with acks=1 (ConfigException at producer start) — the broker cannot
      # deduplicate without full ISR acknowledgement. acks=all is therefore
      # required; see README "Spec deviations".
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        schema.registry.url: http://localhost:8081
        auto.register.schemas: true
        # Reject records that do not match the registered writer schema.
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        linger.ms: 0

app:
  kafka:
    product-topic: ${KAFKA_PRODUCT_TOPIC:products-topic}
